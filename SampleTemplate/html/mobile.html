<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download App</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column; /* Ensure column direction for portrait orientation */
            background-image: url('TemplateData/mobile_error/background-image.jpg'); /* Replace with your background image path */
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        .portrait-content, .horizontal-content {
            display: none;
        }
        .mobile-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }
        .transparent-button {
                background: none;
                border: none;
                padding: 0;
        }

        .portrait-content {
            width: 70%;
            max-width: 650px; /* Дефолтне значення для max-width */
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 
        ##Device = Desktops
        ##Screen = 1281px to higher resolution desktops
        */
        @media (min-width: 1281px) and (orientation: portrait) {
            .portrait-content {
                width: 70%;
                max-width: 850px;
            }
        }

        /* 
        ##Device = Laptops, Desktops
        ##Screen = B/w 1025px to 1280px
        */
        @media (min-width: 1025px) and (max-width: 1280px) and (orientation: portrait) {
            .portrait-content {
                width: 70%;
                max-width: 850px;
            }
        }

        /* 
        ##Device = Tablets, Ipads (portrait)
        ##Screen = B/w 768px to 1024px
        */
        @media (min-width: 768px) and (max-width: 1024px) and (orientation: portrait) {
            .portrait-content {
                width: 70%;
                max-width: 850px;
            }
        }

        /* 
        ##Device = Low Resolution Tablets, Mobiles
        ##Screen = B/w 481px to 767px
        */
        @media (min-width: 481px) and (max-width: 767px) and (orientation: portrait) {
            .portrait-content {
                width: 70%;
                max-width: 650px;
            }
        }

        /* 
        ##Device = Most of the Smartphones Mobiles (Portrait)
        ##Screen = B/w 320px to 479px
        */
        @media (min-width: 320px) and (max-width: 480px) and (orientation: portrait) {
            .portrait-content {
                width: 70%;
                max-width: 650px;
            }
        }

        @media (orientation: portrait) {
            .horizontal-content {
                display: none;
            }

            .portrait-content img {
                width: 100%; /* Make sure each image takes full width of its container */
            }
            
            .portrait-content-main {
                width: 70%; /* Adjust as needed */
                /* max-width: 600px; */
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .portrait-content-main img {
                width: 100%; /* Make sure each image takes full width of its container */
                margin-bottom: 20px; /* Space between images */
            }
            
            .portrait-content-main-center {
                width: 100%; /* Adjust as needed */
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .portrait-content-main-center img {
                width: 100%; /* Make sure each image takes full width of its container */
                margin-bottom: 20px; /* Space between images */
            }

            .download-button img {
                display: block;
                margin-left: auto;
                margin-right: auto;
                padding-top: 30px;
                width: 100%; /* Adjust button size as needed */
            }
            .logo-company {
                display: none;
            }
            .header {
                margin-top: 30px;
                margin-bottom: 30px;
            }
        }
        @media (orientation: landscape) {
            body {
                flex-direction: row;
            }
            .horizontal-content {
                display: flex;
                width: 100%;
                height: 100%;
                align-items: center;
                justify-content: space-between;
                padding: 20px;
            }
            .portrait-content {
                display: none;
            }
            .left-section, .right-section {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: relative;
            }
            .left-section {
                align-items: flex-start;
                justify-content: flex-start;
                padding-left: 50px;
            }
            .right-section {
                align-items: flex-end;
                justify-content: center; /* Center vertically */
                padding-right: 20px;
            }
            .left-section img {
                height: auto;
            }
            .right-section img {
                width: auto;
                max-width: 80%;
                margin-bottom: 20px; /* Space between images */
            }
            .header {
                width: 80%; /* Adjust as needed */
                max-width: 450px; /* Slightly larger than description */
                margin: 20px 0;
            }
            .app-logo {
                max-width: 90%;
            }
            .description {
                width: 80%; /* Adjust as needed */
                max-width: 400px;
                margin: 20px 0;
            }
            .logo-company {
                display: block;
                position: absolute;
                top: 10px;
                left: 10px;
                width: 15%; /* Adjust as needed */
                max-width: 200px;
            }
            .download-button {
                width: 60%; /* To align the button with the right section content */
                max-width: 400px;
                display: flex;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-content" style="display: block;">
    <div class="mobile-container">
        <!-- Portrait Orientation -->
        <div class="portrait-content">
            <img src="TemplateData/mobile_error/header-image.png" alt="Header Image" class="header"> <!-- Replace with your header image path -->
            <div class="portrait-content-main">
                <div class="portrait-content-main-center">
                    <img src="TemplateData/mobile_error/app-logo.png" alt="App Logo"> <!-- Replace with your app logo image path -->
                    <img src="TemplateData/mobile_error/company-logo.png" alt="Company Logo"> <!-- Replace with your company logo image path -->
                    <img src="TemplateData/mobile_error/description-image.png" alt="Description Image"> <!-- Replace with your description image path -->
                </div>
                
               <div class="download-button">
                    <button onclick="openGooglePlay()" class="transparent-button">
                        <img src="TemplateData/mobile_error/google-play-button.png" alt="Get it on Google Play"> <!-- Replace with your Google Play button image path -->
                    </button>
                </div>
            </div>
        </div>

        <!-- Landscape Orientation -->
        <div class="horizontal-content">
            <div class="left-section">
                <img src="TemplateData/mobile_error/app-logo.png" alt="App Logo" class="app-logo"> <!-- Replace with your app logo image path -->
            </div>
            <div class="right-section">
                <img src="TemplateData/mobile_error/header-image.png" alt="Header Image" class="header"> <!-- Replace with your header image path -->
                <img src="TemplateData/mobile_error/description-image.png" alt="Description Image" class="description"> <!-- Replace with your description image path -->
                <div class="download-button">
                    <button onclick="openGooglePlay()" class="transparent-button">
                        <img src="TemplateData/mobile_error/google-play-button.png" alt="Get it on Google Play"> <!-- Replace with your Google Play button image path -->
                    </button>
                </div>
            </div>
            <img src="TemplateData/mobile_error/company-logo.png" alt="Company Logo" class="logo-company"> <!-- Replace with your company logo image path -->
        </div>
    </div>
    </div>
    <script>
        function openGooglePlay() {
            // Replace with your Google Play Store app URL
            window.open('https://play.google.com/store/apps/details?id=YOUR_APP_PACKAGE_NAME&referrer=utm_source%3Dwebpage%26utm_medium%3Dplug', '_blank');
            sendEvent(Games_Mobile_Browser_GooglePlay_Clicked);
        }
    </script>
</body>
</html>
