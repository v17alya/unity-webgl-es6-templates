<!DOCTYPE html>
<html lang="en-us">
    <head>
        <title>{{{ PRODUCT_NAME }}}</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="description" content="{{{ PRODUCT_DESCRIPTION }}}">
        <meta name="keywords" content="Unity WebGL Game">
        <meta property="og:title" content="{{{ PRODUCT_NAME }}}">
        <meta property="og:description" content="{{{ PRODUCT_DESCRIPTION }}}">
        <meta property="og:image" content="YOUR_OG_IMAGE_URL_HERE"/>
        <link rel="shortcut icon" href="TemplateData/favicon.ico">
        <link rel="stylesheet" href="TemplateData/css/style.css?v={{{ PRODUCT_VERSION }}}">
        <script src="src/modulepath.bootstrap.js"></script>
        <script src="src/redirects.js" defer></script>
    </head>
    <body>
        <div id="version-overlay" style="display: none;">
            V{{{ PRODUCT_VERSION }}}
        </div>
        <div id="unity-container" class="unity-desktop" style="display:none">
            <div id="loader_canvas_div">
                <img class="shadow" id="SPLASH_SCREEN"
                     style="position: absolute;  top: 0; left: 0; width: 100%; height: 100%; object-fit: cover">
                <img id="logo" style="display:none;">
                <!-- <div id="start-container">
                <button id="start-button">Start</button>
            </div> -->
                <div class="loading-text" id="loading-text" style="display: none;">LOADING<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                <div id="unity-loading-bar">
                    <div id="unity-progress-bar-empty">
                        <div id="unity-progress-bar-full"></div>
                    </div>
                </div>
            </div>
            <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
            <div id="unity-warning"></div>
            <div id="unity-footer">
                <!-- <div id="unity-webgl-logo"></div> -->
                <!-- <div id="unity-fullscreen-button"></div> -->
                <!-- <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div> -->
            </div>
        </div>
        <div id="mobile-content" style="display:none">
            <!-- Mobile content -->
        </div>

        <script type="module">
            import { startUnity } from "./src/bootstrapper.module.js?v={{{ PRODUCT_VERSION }}}";
            const buildUrl = "Build";

            // LOADER_FILE_URL, DATA_FILE_URL, DATA_FILE_MOBILE_URL, etc are replaced by the actual values in the build process (github actions). You can replace them with the actual values in the code.
            const options = {
                loaderUrl: "LOADER_FILE_URL",
                dataFilePcUrl: "DATA_FILE_URL",
                dataFileMobileUrl: "DATA_FILE_MOBILE_URL",
                frameworkUrl: "FRAMEWORK_FILE_URL",
                streamingAssetsUrl: "FOLDER_NAME_STREAMING_ASSETS",
                buildUrl: buildUrl,
                companyName: "{{{ COMPANY_NAME }}}",
                productName: "{{{ PRODUCT_NAME }}}",

                #if USE_THREADS
                workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
                #endif
                #if USE_WASM
                codeUrl: "WASM_FILE_URL",
                #endif
                #if MEMORY_FILENAME
                memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
                #endif
                #if SYMBOLS_FILENAME
                symbolsUrl: "{{{ SYMBOLS_FILENAME }}}",
                #endif

                productVersion: "{{{ PRODUCT_VERSION }}}"
            };

            //await startUnity(options);
            startUnity(options).catch(console.error);
        </script>
        <script src="src/others.js" defer></script>
    </body>
</html>
